<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laurent SICOLI-TAM</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: #111827;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }

    h1 {
      margin-top: 0;
      color: #f8fafc;
      text-align: center;
    }

    p.subtitle {
      text-align: center;
      color: #cbd5e1;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1e293b;
      color: white;
      font-size: 15px;
      box-sizing: border-box;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .buttons {
      margin-top: 30px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .generate {
      background: #2563eb;
      color: white;
    }

    .clear {
      background: #475569;
      color: white;
    }

    .preview {
      margin-top: 30px;
      background: #020617;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 16px;
      white-space: pre-wrap;
      font-family: monospace;
      color: #93c5fd;
    }

    .footer {
      margin-top: 30px;
      font-size: 13px;
      color: #94a3b8;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="container">
  <div style="text-align:center; margin-bottom: 10px;">
    <img src="circle L-white.png" alt="Logo" style="width:100px;height:100px;border-radius:20px;object-fit:contain;">
  </div>

  <h1>Laurent SICOLI-TAM</h1>

  <p class="subtitle">
    Generate a SICOLI-compatible TXT import file.
  </p>

  <label for="mobileFilesUpload">Load mobile-files.txt</label>
  <input type="file" id="mobileFilesUpload" accept=".txt" />

  <label for="fileSelect">File</label>
  <select id="fileSelect">
    <option value="">Please load mobile-files.txt</option>
  </select>

  <label for="instructions">Instructions</label>
  <textarea id="instructions" maxlength="500" placeholder="Describe the task..."></textarea>

  <label for="deadline">Deadline</label>
  <input type="date" id="deadline" />

  <label for="importance">Importance</label>
  <select id="importance">
    <option>Priority</option>
    <option>Regular</option>
    <option>Keep in mind</option>
  </select>

  <label for="taskType">Type</label>
  <select id="taskType">
    <option>Procedural</option>
    <option>Correspondence</option>
    <option>Memo/Opinion</option>
    <option>Research</option>
    <option>AML</option>
    <option>IT</option>
    <option>Undefined</option>
  </select>

  <div class="buttons">
    <button class="generate" onclick="generateTxt()">
      Generate TXT File
    </button>

    <button class="clear" onclick="clearForm()">
      Clear
    </button>
  </div>

  <div class="preview" id="preview">
TXT preview will appear here.
  </div>

  <div class="footer">
    Save the generated TXT file into:<br>
    <strong>SICOLI-TAM/imports/</strong>
  </div>
</div>

<script>

function todayISO() {
  return new Date().toISOString().split('T')[0];
}

function timestamp() {
  const d = new Date();

  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');

  const hh = String(d.getHours()).padStart(2, '0');
  const mi = String(d.getMinutes()).padStart(2, '0');
  const ss = String(d.getSeconds()).padStart(2, '0');

  return `${yyyy}${mm}${dd}-${hh}${mi}${ss}`;
}

function sanitize(value) {
  return value
    .replace(/\r/g, ' ')
    .replace(/\n/g, ' ')
    .trim();
}

function generateTxt() {

  const fileUuid = sanitize(document.getElementById('fileSelect').value);
  const instructions = sanitize(document.getElementById('instructions').value);
  const deadline = document.getElementById('deadline').value;
  const importance = document.getElementById('importance').value;
  const taskType = document.getElementById('taskType').value;

  if (!fileUuid) {
    alert('File UUID is required.');
    return;
  }

  if (!instructions) {
    alert('Instructions are required.');
    return;
  }

  if (!deadline) {
    alert('Deadline is required.');
    return;
  }

  const creationDate = todayISO();

  const content =
`ACTION=create_task
FILE_UUID=${fileUuid}
INSTRUCTIONS=${instructions}
CREATION_DATE=${creationDate}
DEADLINE=${deadline}
IMPORTANCE=${importance}
TYPE=${taskType}`;

  document.getElementById('preview').textContent = content;

  const blob = new Blob([content], { type: 'text/plain' });

  const link = document.createElement('a');

  link.href = URL.createObjectURL(blob);
  link.download = `task-${timestamp()}.txt`;

  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

function clearForm() {
  document.getElementById('fileSelect').selectedIndex = 0;
  document.getElementById('instructions').value = '';
  document.getElementById('deadline').value = '';
  document.getElementById('importance').selectedIndex = 0;
  document.getElementById('taskType').selectedIndex = 0;

  document.getElementById('preview').textContent = 'TXT preview will appear here.';
}

async function loadFilesFromUpload(event) {

  const file = event.target.files[0];

  if (!file) {
    return;
  }

  try {

    const text = await file.text();

    const lines = text
      .split('
')
      .map(line => line.trim())
      .filter(line => line.length > 0);

    const select = document.getElementById('fileSelect');

    select.innerHTML = '';

    lines.forEach(line => {

      const parts = line.split('||');

      if (parts.length < 2) {
        return;
      }

      const uuid = parts[0].trim();
      const name = parts[1].trim();

      const option = document.createElement('option');

      option.value = uuid;
      option.textContent = name;

      select.appendChild(option);
    });

    if (select.options.length === 0) {
      select.innerHTML = '<option value="">No valid entries found</option>';
    }

  } catch (error) {

    console.error(error);

    const select = document.getElementById('fileSelect');

    select.innerHTML = '<option value="">Unable to read file</option>';
  }
}

document
  .getElementById('mobileFilesUpload')
  .addEventListener('change', loadFilesFromUpload);

</script>

</body>
</html>
