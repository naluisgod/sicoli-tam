<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>sicoliTAM</title>

<style>

    * {
        box-sizing: border-box;
    }

    body {

        margin: 0;
        padding: 40px 20px;

        background:
            linear-gradient(
                180deg,
                #eef4fb 0%,
                #dde9f7 100%
            );

        color: #1d2b42;

        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            Roboto,
            Arial,
            sans-serif;
    }

    .container {

        max-width: 920px;

        margin: auto;

        background: rgba(255,255,255,0.88);

        backdrop-filter: blur(10px);

        border-radius: 28px;

        padding: 45px;

        border: 1px solid rgba(255,255,255,0.5);

        box-shadow:
            0 10px 40px rgba(28,52,84,0.12),
            0 2px 10px rgba(28,52,84,0.08);
    }

    .logo {

        width: 110px;
        height: 110px;

        display: block;

        margin: 0 auto 24px auto;

        border-radius: 50%;

        box-shadow:
            0 8px 24px rgba(0,0,0,0.15);
    }

    h1 {

        text-align: center;

        margin: 0;

        font-size: 56px;

        letter-spacing: -2px;

        color: #18304f;
    }

    .subtitle {

        text-align: center;

        color: #5e728d;

        margin-top: 14px;
        margin-bottom: 45px;

        font-size: 20px;

        font-weight: 500;
    }

    label {

        display: block;

        margin-top: 28px;
        margin-bottom: 10px;

        font-size: 17px;

        font-weight: 700;

        color: #2a4163;
    }

    input,
    textarea,
    select {

        width: 100%;

        background: #f8fbff;

        color: #24354f;

        border: 1px solid #c9d7ea;

        border-radius: 16px;

        padding: 16px 18px;

        font-size: 17px;

        transition:
            border-color 0.2s ease,
            box-shadow 0.2s ease,
            background 0.2s ease;
    }

    input:focus,
    textarea:focus,
    select:focus {

        outline: none;

        border-color: #5d8fe8;

        background: white;

        box-shadow:
            0 0 0 5px rgba(93,143,232,0.18);
    }

    textarea {

        min-height: 160px;

        resize: vertical;

        line-height: 1.5;
    }

    .buttons {

        display: flex;

        gap: 18px;

        margin-top: 40px;
    }

    button {

        flex: 1;

        border: none;

        border-radius: 18px;

        padding: 18px;

        font-size: 20px;

        font-weight: 700;

        cursor: pointer;

        transition:
            transform 0.12s ease,
            opacity 0.12s ease,
            box-shadow 0.15s ease;
    }

    button:hover {

        transform: translateY(-2px);

        opacity: 0.96;
    }

    button:active {

        transform: translateY(1px);
    }

    .generate {

        background:
            linear-gradient(
                135deg,
                #4d8df5 0%,
                #3a6fe2 100%
            );

        color: white;

        box-shadow:
            0 8px 22px rgba(58,111,226,0.25);
    }

    .clear {

        background:
            linear-gradient(
                135deg,
                #8c9db5 0%,
                #70829b 100%
            );

        color: white;

        box-shadow:
            0 8px 22px rgba(70,90,120,0.18);
    }

    .preview {

        margin-top: 42px;

        background: #f4f8fd;

        border: 1px solid #d5e0ee;

        border-radius: 18px;

        padding: 26px;

        white-space: pre-wrap;

        font-family:
            "SFMono-Regular",
            Consolas,
            monospace;

        color: #24415f;

        font-size: 15px;

        line-height: 1.55;

        overflow-x: auto;
    }

    .upload-section {

        margin-bottom: 28px;
    }

    .status {

        margin-top: 12px;

        color: #55749c;

        font-size: 15px;
    }

    ::placeholder {

        color: #91a2b8;
    }

    @media (max-width: 700px) {

        body {

            padding: 20px 12px;
        }

        .container {

            padding: 28px;
        }

        h1 {

            font-size: 42px;
        }

        .buttons {

            flex-direction: column;
        }
    }

</style>

</head>

<body>

<div class="container">

    <img src="waterdrop.png" class="logo">

    <h1>sicoli</h1>

    <div class="subtitle">
        manage tasks anywhere — without exposing files, clients, or existing data
    </div>

    <div class="upload-section">

        <label>Upload DATA</label>

        <input type="file" id="mobileFileInput" accept=".txt">

        <div class="status" id="loadStatus">
            No file loaded.
        </div>

    </div>

    <label>File</label>

    <select id="fileSelect">
        <option>Please load DATA</option>
    </select>

    <label>Instructions</label>

    <textarea
        id="instructions"
        placeholder="Describe the task..."></textarea>

    <label>Deadline</label>

    <input type="date" id="deadline">

    <label>Importance</label>

    <select id="importance">
        <option>Priority</option>
        <option>Regular</option>
        <option>Keep in mind</option>
    </select>

    <label>Type</label>

    <select id="taskType">
        <option>Procedural</option>
        <option>Correspondence</option>
        <option>Memo/Opinion</option>
        <option>Research</option>
        <option>AML</option>
        <option>IT</option>
        <option>Undefined</option>
    </select>

    <div class="buttons">

        <button class="generate" onclick="generateTXT()">
            Preview
        </button>

        <button class="clear" onclick="clearForm()">
            Clear
        </button>

    </div>

    <div class="preview" id="preview">
Preview will appear here.
    </div>

</div>

<script>

const mobileFileInput =
    document.getElementById("mobileFileInput");

const fileSelect =
    document.getElementById("fileSelect");

const loadStatus =
    document.getElementById("loadStatus");

mobileFileInput.addEventListener("change", function(event) {

    const file = event.target.files[0];

    if (!file) {
        return;
    }

    const reader = new FileReader();

    reader.onload = function(e) {

        const text = e.target.result;

        fileSelect.innerHTML = "";

        const lines = text.split("\n");

        let loaded = 0;

        lines.forEach(line => {

            line = line.trim();

            if (!line) return;

            const parts = line.split("||");

            if (parts.length < 2) return;

            const uuid = parts[0].trim();
            const name = parts[1].trim();

            const option = document.createElement("option");

            option.value = uuid;
            option.textContent = name;

            fileSelect.appendChild(option);

            loaded++;

        });

        if (loaded === 0) {

            const option =
                document.createElement("option");

            option.textContent =
                "No valid entries found";

            fileSelect.appendChild(option);

            loadStatus.textContent =
                "No valid entries found.";

        } else {

            loadStatus.textContent =
                loaded + " file(s) loaded successfully.";
        }

    };

    reader.readAsText(file);

});

function generateTXT() {

    const selectedUUID = fileSelect.value;

    const instructions =
        document
            .getElementById("instructions")
            .value
            .trim();

    const deadline =
        document
            .getElementById("deadline")
            .value;

    const importance =
        document
            .getElementById("importance")
            .value;

    const taskType =
        document
            .getElementById("taskType")
            .value;

    const today =
        new Date()
            .toISOString()
            .split("T")[0];

    if (
        !selectedUUID ||
        selectedUUID === "Please load mobile-files.txt"
    ) {

        alert(
            "Please load mobile-files.txt and choose a file."
        );

        return;
    }

    if (!instructions) {

        alert("Please enter instructions.");

        return;
    }

    if (!deadline) {

        alert("Please select a deadline.");

        return;
    }

    const content =
`{
  "action": "create_task",
  "file_uuid": "${selectedUUID}",
  "instructions": "${instructions}",
  "creation_date": "${today}",
  "deadline": "${deadline}",
  "importance": "${importance}",
  "type": "${taskType}"
}`;

    document
        .getElementById("preview")
        .textContent = content;

    const blob =
        new Blob(
            [content],
            { type: "text/plain" }
        );

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    const timestamp =
        new Date()
            .toISOString()
            .replace(/[:.]/g, "-");

    a.href = url;

    a.download =
        `task-${timestamp}.json`;

    document.body.appendChild(a);

    a.click();

    document.body.removeChild(a);

    URL.revokeObjectURL(url);

}

function clearForm() {

    document
        .getElementById("instructions")
        .value = "";

    document
        .getElementById("deadline")
        .value = "";

    document
        .getElementById("importance")
        .selectedIndex = 0;

    document
        .getElementById("taskType")
        .selectedIndex = 0;

    document
        .getElementById("preview")
        .textContent =
            "Preview will appear here.";
}

</script>

</body>
</html>
