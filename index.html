<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Laurent SICOLI-TAM</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 30px;
        background: #050b18;
        color: #ffffff;
        font-family: Arial, sans-serif;
    }

    .container {
        max-width: 900px;
        margin: auto;
        background: #08152e;
        border-radius: 18px;
        padding: 40px;
        border: 1px solid #1b2d55;
        box-shadow: 0 0 30px rgba(0,0,0,0.5);
    }

    .logo {
        width: 100px;
        height: 100px;
        display: block;
        margin: 0 auto 20px auto;
        border-radius: 50%;
    }

    h1 {
        text-align: center;
        margin: 0;
        font-size: 52px;
    }

    .subtitle {
        text-align: center;
        color: #b7c2d9;
        margin-top: 18px;
        margin-bottom: 40px;
        font-size: 20px;
    }

    label {
        display: block;
        margin-top: 25px;
        margin-bottom: 10px;
        font-size: 18px;
        font-weight: bold;
    }

    input,
    textarea,
    select {
        width: 100%;
        background: #1a2744;
        color: white;
        border: 1px solid #31456f;
        border-radius: 12px;
        padding: 16px;
        font-size: 18px;
    }

    textarea {
        min-height: 140px;
        resize: vertical;
    }

    .buttons {
        display: flex;
        gap: 20px;
        margin-top: 35px;
    }

    button {
        flex: 1;
        border: none;
        border-radius: 12px;
        padding: 18px;
        font-size: 22px;
        font-weight: bold;
        cursor: pointer;
    }

    .generate {
        background: #2d66e0;
        color: white;
    }

    .clear {
        background: #4d5f82;
        color: white;
    }

    .preview {
        margin-top: 40px;
        background: #020817;
        border: 1px solid #203458;
        border-radius: 12px;
        padding: 25px;
        white-space: pre-wrap;
        font-family: monospace;
        color: #9dd0ff;
        font-size: 16px;
    }

    .upload-section {
        margin-bottom: 25px;
    }

    .status {
        margin-top: 10px;
        color: #9dd0ff;
        font-size: 15px;
    }

</style>
</head>

<body>

<div class="container">

    <img src="logo.png" class="logo">

    <h1>Laurent SICOLI-TAM</h1>

    <div class="subtitle">
        Generate a SICOLI-compatible TXT import file.
    </div>

    <div class="upload-section">

        <label>Load mobile-files.txt</label>

        <input type="file" id="mobileFileInput" accept=".txt">

        <div class="status" id="loadStatus">
            No file loaded.
        </div>

    </div>

    <label>File</label>

    <select id="fileSelect">
        <option>Please load mobile-files.txt</option>
    </select>

    <label>Instructions</label>

    <textarea id="instructions" placeholder="Describe the task..."></textarea>

    <label>Deadline</label>

    <input type="date" id="deadline">

    <label>Importance</label>

    <select id="importance">
        <option>Priority</option>
        <option>Regular</option>
        <option>Keep in mind</option>
    </select>

    <label>Type</label>

    <select id="taskType">
        <option>Procedural</option>
        <option>Correspondence</option>
        <option>Memo/Opinion</option>
        <option>Research</option>
        <option>AML</option>
        <option>IT</option>
        <option>Undefined</option>
    </select>

    <div class="buttons">
        <button class="generate" onclick="generateTXT()">
            Generate TXT File
        </button>

        <button class="clear" onclick="clearForm()">
            Clear
        </button>
    </div>

    <div class="preview" id="preview">
TXT preview will appear here.
    </div>

</div>

<script>

const mobileFileInput = document.getElementById("mobileFileInput");
const fileSelect = document.getElementById("fileSelect");
const loadStatus = document.getElementById("loadStatus");

mobileFileInput.addEventListener("change", function(event) {

    const file = event.target.files[0];

    if (!file) {
        return;
    }

    const reader = new FileReader();

    reader.onload = function(e) {

        const text = e.target.result;

        fileSelect.innerHTML = "";

        const lines = text.split("\n");

        let loaded = 0;

        lines.forEach(line => {

            line = line.trim();

            if (!line) return;

            const parts = line.split("||");

            if (parts.length < 2) return;

            const uuid = parts[0].trim();
            const name = parts[1].trim();

            const option = document.createElement("option");

            option.value = uuid;
            option.textContent = name;

            fileSelect.appendChild(option);

            loaded++;

        });

        if (loaded === 0) {

            const option = document.createElement("option");
            option.textContent = "No valid entries found";
            fileSelect.appendChild(option);

            loadStatus.textContent = "No valid entries found.";

        } else {

            loadStatus.textContent =
                loaded + " file(s) loaded successfully.";

        }

    };

    reader.readAsText(file);

});

function generateTXT() {

    const selectedUUID = fileSelect.value;

    const instructions =
        document.getElementById("instructions").value.trim();

    const deadline =
        document.getElementById("deadline").value;

    const importance =
        document.getElementById("importance").value;

    const taskType =
        document.getElementById("taskType").value;

    const today = new Date().toISOString().split("T")[0];

    if (!selectedUUID || selectedUUID === "Please load mobile-files.txt") {
        alert("Please load mobile-files.txt and choose a file.");
        return;
    }

    if (!instructions) {
        alert("Please enter instructions.");
        return;
    }

    if (!deadline) {
        alert("Please select a deadline.");
        return;
    }

    const content =
`{
  "action": "create_task",
  "file_uuid": "${selectedUUID}",
  "instructions": "${instructions}",
  "creation_date": "${today}",
  "deadline": "${deadline}",
  "importance": "${importance}",
  "type": "${taskType}"
}`;

    document.getElementById("preview").textContent = content;

    const blob = new Blob([content], { type: "text/plain" });

    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");

    const timestamp =
        new Date().toISOString().replace(/[:.]/g, "-");

    a.href = url;
    a.download = `task-${timestamp}.txt`;

    document.body.appendChild(a);

    a.click();

    document.body.removeChild(a);

    URL.revokeObjectURL(url);

}

function clearForm() {

    document.getElementById("instructions").value = "";

    document.getElementById("deadline").value = "";

    document.getElementById("importance").selectedIndex = 0;

    document.getElementById("taskType").selectedIndex = 0;

    document.getElementById("preview").textContent =
        "TXT preview will appear here.";

}

</script>

</body>
</html>
